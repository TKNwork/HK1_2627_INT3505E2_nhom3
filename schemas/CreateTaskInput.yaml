# ============================================================
# PHÂN CÔNG: THÀNH VIÊN 2
# NHIỆM VỤ: Định nghĩa dữ liệu đầu vào khi tạo mới công việc (POST /tasks)
# NHÁNH: feature/create-task
# ============================================================
# TODO (Thành viên 2):
# - Kiểm tra và hoàn thiện các ràng buộc validation (minLength, maxLength, format).
# - Xác định trường bắt buộc (required: [title]).
# - Đảm bảo tham chiếu đúng TaskStatus.yaml và TaskPriority.yaml.
# ============================================================

type: object
required:
  - title
properties:
  title:
    type: string
    description: Tiêu đề công việc
    minLength: 1
    maxLength: 200
    example: "Viết đặc tả OpenAPI cho Task API"
  status:
    $ref: './TaskStatus.yaml'
  priority:
    $ref: './TaskPriority.yaml'
  dueDate:
    type: string
    format: date
    description: Hạn hoàn thành công việc (YYYY-MM-DD)
    example: "2026-10-25"
  assigneeId:
    type: string
    description: ID định danh người được giao việc
    example: "user-02"
