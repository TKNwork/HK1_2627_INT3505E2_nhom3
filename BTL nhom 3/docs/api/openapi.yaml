        required: true
        description: ID tài nguyên.
        schema: *id008
      responses:
        '200':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '401':
          description: Thông tin xác thực không hợp lệ hoặc phiên đã hết hiệu lực.
          content:
