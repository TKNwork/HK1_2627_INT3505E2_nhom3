openapi: 3.1.1
info:
  title: SmartSchedule Core API
  version: 1.0.0
  description: 'Hợp đồng API của Core Service cho SmartSchedule.


    **Phiên bản** — Đường dẫn dùng /api/v1. Thay đổi tương thích tiếp tục áp dụng trong v1. Thay đổi phá
    vỡ hợp đồng dùng /api/v2 và công bố thời gian chuyển đổi.


    **Phân quyền** — Admin quản lý tài khoản. User sử dụng phòng chat theo tư cách thành viên. Core thực
    thi kiểm tra quyền trên từng request. JWT không thay thế việc kiểm tra trạng thái tài khoản và phiên.


    **Phân trang** — Mặc định 20, tối đa 100. nextCursor là null khi hết trang. Lịch sử chat dùng after.
    Các danh sách còn lại dùng cursor. Thứ tự được mô tả ở từng operation.


    **Lỗi** — Phản hồi JSON theo schema Error. code dùng để xử lý bằng chương trình. message dành cho
    người đọc. requestId dùng để đối chiếu log. details là thông tin bổ sung nếu có.'
servers:
- url: /api/v1
  description: Đường dẫn tương đối trên máy chủ API
security:
- bearerAuth: []
tags:
- name: Tài khoản và phiên
- name: Quản trị
- name: Phòng chat
- name: Phân tích AI
- name: Lịch nhắc
paths:
  /users:
    post:
      operationId: registerUser
      tags:
      - Tài khoản và phiên
      summary: Đăng ký tài khoản
      description: Công khai. Tài khoản mới có vai trò user và trạng thái active.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - displayName
              - email
              - password
              properties:
                displayName: &id004
                  type: string
                  minLength: 1
                email: &id001
                  type: string
                  format: email
                password: &id002
                  type: string
                  format: password
                  minLength: 1
              additionalProperties: false
      responses:
        '201':
          description: Tạo thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '409':
          description: Email đã tồn tại.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: CONFLICT
                message: Email đã tồn tại.
                requestId: req-01HZX9
        '422':
          description: Dữ liệu đầu vào không hợp lệ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: VALIDATION_ERROR
                message: Dữ liệu đầu vào không hợp lệ.
                requestId: req-01HZX9
        '500':
          description: Core Service gặp lỗi khi xử lý yêu cầu.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: INTERNAL_ERROR
                message: Core Service gặp lỗi khi xử lý yêu cầu.
                requestId: req-01HZX9
  /sessions:
    post:
      operationId: createSession
      tags:
      - Tài khoản và phiên
      summary: Đăng nhập
      description: Công khai.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - password
              properties:
                email: *id001
                password: *id002
              additionalProperties: false
      responses:
        '201':
          description: Tạo thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
          headers:
            Set-Cookie: &id003
              description: Thiết lập hoặc xóa cookie refreshToken tùy thao tác.
              schema:
                type: string
        '401':
          description: Email hoặc mật khẩu không đúng.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: UNAUTHENTICATED
                message: Email hoặc mật khẩu không đúng.
                requestId: req-01HZX9
        '403':
          description: Tài khoản đã bị khóa.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: FORBIDDEN
                message: Tài khoản đã bị khóa.
                requestId: req-01HZX9
        '422':
          description: Dữ liệu đầu vào không hợp lệ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: VALIDATION_ERROR
                message: Dữ liệu đầu vào không hợp lệ.
                requestId: req-01HZX9
        '500':
          description: Core Service gặp lỗi khi xử lý yêu cầu.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: INTERNAL_ERROR
                message: Core Service gặp lỗi khi xử lý yêu cầu.
                requestId: req-01HZX9
  /sessions/refresh:
    post:
      operationId: refreshSession
      tags:
      - Tài khoản và phiên
      summary: Làm mới access token
      description: Yêu cầu cookie refreshToken hợp lệ. Core kiểm tra phiên, trạng thái tài khoản và xoay
        vòng refresh token.
      security:
      - refreshCookie: []
      responses:
        '200':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
          headers:
            Set-Cookie: *id003
        '401':
          description: Thông tin xác thực không hợp lệ hoặc phiên đã hết hiệu lực.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: UNAUTHENTICATED
                message: Thông tin xác thực không hợp lệ hoặc phiên đã hết hiệu lực.
                requestId: req-01HZX9
        '500':
          description: Core Service gặp lỗi khi xử lý yêu cầu.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: INTERNAL_ERROR
                message: Core Service gặp lỗi khi xử lý yêu cầu.
                requestId: req-01HZX9
