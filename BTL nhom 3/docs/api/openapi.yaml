                message: Core Service gặp lỗi khi xử lý yêu cầu.
                requestId: req-01HZX9
  /admin/users:
    get:
      operationId: listUsers
      tags:
      - Quản trị
      summary: Xem danh sách tài khoản
      description: Chỉ vai trò admin. Thứ tự cố định theo thời điểm tạo giảm dần rồi ID tăng dần.
      parameters:
      - name: status
        in: query
        required: false
        description: Lọc theo trạng thái tài khoản.
        schema: &id005
          type: string
          enum:
          - active
          - locked
      - &id006
        name: cursor
        in: query
        required: false
        description: Dùng nextCursor từ trang trước. Giữ nguyên bộ lọc.
        schema: *id004
      - &id007
        name: limit
        in: query
        required: false
        description: Số phần tử tối đa trên trang.
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      responses:
        '200':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
        '400':
          description: Tham số truy vấn không hợp lệ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: INVALID_QUERY
