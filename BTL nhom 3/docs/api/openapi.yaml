      description: Yêu cầu cookie refreshToken hợp lệ. Thu hồi phiên và xóa cookie.
      security:
      - refreshCookie: []
      responses:
        '204':
          description: Đã kết thúc phiên.
          headers:
            Set-Cookie: *id003
        '401':
          description: Thông tin xác thực không hợp lệ hoặc phiên đã hết hiệu lực.
