  /groups/{groupId}/reminders/{reminderId}:
    patch:
      operationId: updateReminder
      tags:
      - Lịch nhắc
      summary: Đổi giờ hoặc hủy lịch nhắc
      description: Chỉ user có vai trò owner trong phòng. Tăng phiên bản và phát sự kiện để Notification
        Service điều chỉnh lượt gửi.
      parameters:
      - name: groupId
        in: path
        required: true
        description: ID tài nguyên.
        schema: *id008
      - name: reminderId
        in: path
        required: true
        description: ID tài nguyên.
        schema: *id008
      - name: If-Match
        in: header
        required: true
        description: ETag mạnh của phiên bản lịch, ví dụ "v2". Có thể tạo từ trường version trong danh
          sách lịch.
        schema:
          type: string
          pattern: ^"v[1-9][0-9]*"$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
              - type: object
                required:
                - startsAt
                properties:
                  startsAt: *id010
                additionalProperties: false
              - type: object
                required:
                - status
                properties:
                  status:
                    type: string
                    enum:
                    - cancelled
                additionalProperties: false
      responses:
        '200':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reminder'
          headers:
            ETag:
              description: ETag mạnh của phiên bản lịch sau cập nhật.
              schema:
                type: string
                pattern: ^"v[1-9][0-9]*"$
        '401':
          description: Thông tin xác thực không hợp lệ hoặc phiên đã hết hiệu lực.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: UNAUTHENTICATED
                message: Thông tin xác thực không hợp lệ hoặc phiên đã hết hiệu lực.
                requestId: req-01HZX9
        '403':
          description: Chỉ chủ phòng được đổi giờ hoặc hủy lịch.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: FORBIDDEN
                message: Chỉ chủ phòng được đổi giờ hoặc hủy lịch.
                requestId: req-01HZX9
        '404':
          description: Không tìm thấy lịch nhắc trong phòng.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: NOT_FOUND
                message: Không tìm thấy lịch nhắc trong phòng.
                requestId: req-01HZX9
        '412':
          description: Phiên bản lịch đã thay đổi.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: VERSION_MISMATCH
                message: Phiên bản lịch đã thay đổi.
                requestId: req-01HZX9
        '422':
          description: Dữ liệu đầu vào không hợp lệ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: VALIDATION_ERROR
                message: Dữ liệu đầu vào không hợp lệ.
                requestId: req-01HZX9
        '428':
          description: Yêu cầu cần header If-Match.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: PRECONDITION_REQUIRED
                message: Yêu cầu cần header If-Match.
                requestId: req-01HZX9
        '500':
          description: Core Service gặp lỗi khi xử lý yêu cầu.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: INTERNAL_ERROR
                message: Core Service gặp lỗi khi xử lý yêu cầu.
                requestId: req-01HZX9
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token của phiên đang hiệu lực.
    refreshCookie:
      type: apiKey
      in: cookie
      name: refreshToken
      description: Cookie HttpOnly do trình duyệt lưu từ phản hồi đăng nhập hoặc refresh.
  schemas:
    User:
      type: object
      required:
      - id
      - displayName
      - email
      - systemRole
      - status
      properties:
        id: *id008
        displayName: *id004
        email:
          type: string
          format: email
        systemRole:
          type: string
          enum:
          - user
          - admin
        status: *id005
      additionalProperties: false
    Session:
      type: object
      required:
      - accessToken
      - tokenType
      - expiresIn
      - user
      properties:
        accessToken: *id004
        tokenType:
          type: string
          enum:
          - Bearer
        expiresIn: &id012
          type: integer
          minimum: 1
        user:
          $ref: '#/components/schemas/User'
      additionalProperties: false
    Group:
      type: object
      required:
      - id
      - name
      - myRole
      properties:
        id: *id008
        name: *id004
        myRole: &id011
          type: string
          enum:
          - owner
          - member
        inviteCode: *id004
      additionalProperties: false
    Membership:
      type: object
      required:
      - id
      - groupId
      - userId
      - role
      - joinedAt
      properties:
        id: *id008
        groupId: *id008
        userId: *id008
        role: *id011
        joinedAt: *id010
        displayName: *id004
      additionalProperties: false
    Message:
      type: object
      required:
      - id
      - groupId
      - senderType
      - senderId
      - text
      - replyToId
      - seq
      - sentAt
      properties:
        id: *id008
        groupId: *id008
        senderType:
          type: string
          enum:
          - user
          - ai
        senderId:
          anyOf:
          - *id008
          - type: 'null'
        text: *id004
        replyToId:
          anyOf:
          - *id008
          - type: 'null'
        seq: *id012
        sentAt: *id010
      additionalProperties: false
