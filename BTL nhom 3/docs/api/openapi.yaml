                $ref: '#/components/schemas/Error'
              example:
                code: UNAUTHENTICATED
                message: Thông tin xác thực không hợp lệ hoặc phiên đã hết hiệu lực.
                requestId: req-01HZX9
        '403':
          description: Cần vai trò user và tư cách thành viên trong phòng.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: FORBIDDEN
                message: Cần vai trò user và tư cách thành viên trong phòng.
                requestId: req-01HZX9
        '404':
