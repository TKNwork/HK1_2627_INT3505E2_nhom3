tags:
  - tasks
summary: Xóa công việc
description: Xóa vĩnh viễn công việc khỏi hệ thống theo taskId.
operationId: deleteTask
responses:
  '204':
    description: Xóa công việc thành công, không trả về nội dung
  '401':
    description: Thiếu hoặc token xác thực Bearer không hợp lệ
    content:
      application/json:
        schema:
          $ref: '../schemas/Error.yaml'
        example:
          code: UNAUTHORIZED
          message: Token xác thực Bearer không hợp lệ hoặc đã hết hạn
  '404':
    description: Không tìm thấy công việc tương ứng với taskId
    content:
      application/json:
        schema:
          $ref: '../schemas/Error.yaml'
        example:
          code: NOT_FOUND
          message: Không tìm thấy công việc với taskId đã cung cấp
