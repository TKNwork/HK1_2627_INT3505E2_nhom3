# ============================================================
# PHÂN CÔNG: THÀNH VIÊN 3
# NHIỆM VỤ: Định nghĩa payload cập nhật một phần công việc (PATCH /tasks/{taskId})
# NHÁNH: feature/get-update-task
# ============================================================
# TODO (Thành viên 3):
# - Đảm bảo minProperties: 1 (phải có ít nhất một trường cần cập nhật).
# - Các thuộc tính là tùy chọn (optional), không đặt required.
# - Xác thực các trường: title, status, priority, dueDate, assigneeId.
# ============================================================

type: object
description: Dữ liệu gửi lên để cập nhật một phần công việc (chỉ gửi các trường cần thay đổi)
minProperties: 1
properties:
  title:
    type: string
    minLength: 1
    maxLength: 255
    description: Tiêu đề công việc mới
    example: Cập nhật tài liệu thiết kế API và kiểm thử
  status:
    $ref: './TaskStatus.yaml'
  priority:
    $ref: './TaskPriority.yaml'
  dueDate:
    type: string
    format: date
    description: Hạn hoàn thành mới (định dạng YYYY-MM-DD)
    example: '2026-10-25'
  assigneeId:
    type: string
    format: uuid
    nullable: true
    description: UUID của người được phân công xử lý mới
    example: 123e4567-e89b-12d3-a456-426614174002
example:
  title: Cập nhật tài liệu thiết kế API và kiểm thử
  status: in_progress
  priority: high
  dueDate: '2026-10-25'
