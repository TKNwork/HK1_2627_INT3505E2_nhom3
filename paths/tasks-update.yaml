# ============================================================
# PHÂN CÔNG: THÀNH VIÊN 3
# NHIỆM VỤ: Hoàn thiện endpoint PATCH /tasks/{taskId} (Cập nhật một phần công việc)
# NHÁNH LÀM VIỆC: feature/get-update-task
# ============================================================
# TODO (Thành viên 3):
# - Kiểm tra summary, description, operationId (patchTask).
# - Cấu hình requestBody tham chiếu đến schemas/UpdateTaskInput.yaml.
# - Rà soát responses: 200 (Task), 401 (Error), 404 (Error), 422 (Error).
# ============================================================

tags:
  - tasks
summary: Cập nhật một phần công việc
description: Cập nhật một hoặc một số trường thông tin của công việc dựa vào taskId. Không bắt buộc phải gửi toàn bộ các thuộc tính.
operationId: patchTask
requestBody:
  required: true
  description: Thông tin các trường cần cập nhật
  content:
    application/json:
      schema:
        $ref: '../schemas/UpdateTaskInput.yaml'
responses:
  '200':
    description: Cập nhật công việc thành công, trả về thông tin task sau khi cập nhật
    content:
      application/json:
        schema:
          $ref: '../schemas/Task.yaml'
        example:
          id: 123e4567-e89b-12d3-a456-426614174000
          title: Cập nhật tài liệu thiết kế API và kiểm thử
          status: in_progress
          priority: high
          dueDate: '2026-10-25'
          assigneeId: 123e4567-e89b-12d3-a456-426614174002
  '401':
    description: Thiếu hoặc token xác thực Bearer JWT không hợp lệ
    content:
      application/json:
        schema:
          $ref: '../schemas/Error.yaml'
        example:
          code: UNAUTHORIZED
          message: Token xác thực Bearer không hợp lệ hoặc đã hết hạn
  '404':
    description: Không tìm thấy công việc tương ứng với taskId để cập nhật
    content:
      application/json:
        schema:
          $ref: '../schemas/Error.yaml'
        example:
          code: NOT_FOUND
          message: Không tìm thấy công việc với taskId đã cung cấp
  '422':
    description: Dữ liệu gửi lên không hợp lệ (lỗi validation)
    content:
      application/json:
        schema:
          $ref: '../schemas/Error.yaml'
        example:
          code: VALIDATION_ERROR
          message: Dữ liệu cập nhật không hợp lệ
          details:
            - 'dueDate phải có định dạng YYYY-MM-DD'
