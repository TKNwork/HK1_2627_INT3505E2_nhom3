# ============================================================
# PHÂN CÔNG: THÀNH VIÊN 2
# NHIỆM VỤ: Hoàn thiện endpoint POST /tasks (Tạo công việc mới)
# NHÁNH LÀM VIỆC: feature/create-task
# ============================================================
# TODO (Thành viên 2):
# - Kiểm tra thông tin summary, description, operationId (createTask).
# - Kiểm tra requestBody tham chiếu đến schemas/CreateTaskInput.yaml.
# - Rà soát responses: 201 (Task), 401 (Error), 422 (Error).
# ============================================================

summary: Tạo công việc mới
description: Tạo một task mới trong hệ thống. Trả về thông tin task vừa tạo kèm header Location.
operationId: createTask
tags:
  - tasks
requestBody:
  required: true
  description: Dữ liệu khởi tạo công việc
  content:
    application/json:
      schema:
        $ref: '../schemas/CreateTaskInput.yaml'
responses:
  '201':
    description: Tạo công việc thành công
    headers:
      Location:
        description: Đường dẫn URI đến task vừa tạo
        schema:
          type: string
          example: "/v1/tasks/t-1"
    content:
      application/json:
        schema:
          $ref: '../schemas/Task.yaml'
  '401':
    description: Chưa xác thực token Bearer JWT
    content:
      application/problem+json:
        schema:
          $ref: '../schemas/Error.yaml'
  '422':
    description: Dữ liệu gửi lên không hợp lệ hoặc thiếu trường bắt buộc
    content:
      application/problem+json:
        schema:
          $ref: '../schemas/Error.yaml'