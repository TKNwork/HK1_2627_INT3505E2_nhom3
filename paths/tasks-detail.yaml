tags:
  - tasks
summary: Lấy chi tiết công việc
description: Trả về thông tin chi tiết của một công việc cụ thể dựa vào taskId.
operationId: getTaskById
responses:
  '200':
    description: Lấy chi tiết công việc thành công
    content:
      application/json:
        schema:
          $ref: '../schemas/Task.yaml'
  '401':
    description: Thiếu hoặc token xác thực Bearer không hợp lệ
    content:
      application/json:
        schema:
          $ref: '../schemas/Error.yaml'
  '404':
    description: Không tìm thấy công việc tương ứng với taskId
    content:
      application/json:
        schema:
          $ref: '../schemas/Error.yaml'
