name: smartschedule
services:
  core_db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${CORE_DB_NAME:?Run python scripts/setup_local.py}
      POSTGRES_USER: ${CORE_DB_USER:?Run python scripts/setup_local.py}
      POSTGRES_PASSWORD: ${CORE_DB_PASSWORD:?Run python scripts/setup_local.py}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - core_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 15
  notification_db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${NOTIFICATION_DB_NAME:?Run python scripts/setup_local.py}
      POSTGRES_USER: ${NOTIFICATION_DB_USER:?Run python scripts/setup_local.py}
      POSTGRES_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?Run python scripts/setup_local.py}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - notification_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 15
volumes:
  core_db_data:
  notification_db_data:
